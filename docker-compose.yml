services:
  db:
    image: postgres:16-alpine
    container_name: iced_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iced
      POSTGRES_PASSWORD: iced
      POSTGRES_DB: iced
    ports:
      - "5432:5432"
    volumes:
      - iced_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iced -d iced"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  iced_pgdata:
